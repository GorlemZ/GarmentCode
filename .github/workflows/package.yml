name: package

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    name: build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Build distributions
        run: uv build --sdist --wheel
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Test wheel installation from outside checkout
        run: |
          wheel_under_test="$(find dist -name '*.whl' -print -quit)"
          WHEEL_UNDER_TEST="$wheel_under_test" uv run --isolated --no-project --python 3.11 \
            --with 'pytest>=8,<9' \
            --with uv \
            pytest tests/packaging -q
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pygarment-dist
          path: dist/*
